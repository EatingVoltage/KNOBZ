; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = leonardo

[env:leonardo]
platform = atmelavr
board = leonardo_knobz
framework = arduino
n this 
upload_protocol = custom
upload_port = usb 
upload_flags =
    -C
    ; use "tool-avrdude-megaavr" for the atmelmegaavr platform
    $PROJECT_PACKAGES_DIR/tool-avrdude/avrdude.conf
    -p
    $BOARD_MCU
    -P
    $UPLOAD_PORT
    -c
    stk500v2
upload_command = avrdude $UPLOAD_FLAGS -U flash:w:$SOURCE:i


monitor_speed = 31250

; build_flags = -UUSB_SERIAL -DUSB_MIDI
build_flags =
    -DUSB_MIDI
    ; smaller code: shared function prologues + linker call relaxation (saves ~760 bytes flash)
    -mcall-prologues
    -Wl,--relax

lib_deps = 
    Adafruit NeoPixel
    MIDI Library
    blokaslabs/USBMIDI
    VL53L0X

; flash over the USB cable via the Leonardo bootloader (no ISP programmer needed):
;   pio run -e usb -t upload
; standalone on purpose: "extends" would inherit the ISP upload_command above
[env:usb]
platform = atmelavr
board = leonardo_knobz
framework = arduino
upload_protocol = avr109
monitor_speed = 31250
build_flags =
    -DUSB_MIDI
    ; smaller code: shared function prologues + linker call relaxation (saves ~760 bytes flash)
    -mcall-prologues
    -Wl,--relax
; reuse the leonardo env's committed libraries (SSD1306Ascii is only there, copied manually)
lib_extra_dirs = .pio/libdeps/leonardo